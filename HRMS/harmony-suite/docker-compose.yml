# Runs the built Harmony Suite web app.
#
# The database, auth, storage, and edge functions are started separately by the
# Supabase CLI (`supabase start`), which manages its own containers. This file
# covers only the part that was previously served by the dev server.
#
# Start:  docker compose up -d --build
# Stop:   docker compose down
# Or double-click start-harmony.bat, which does both this and Supabase.

services:
  web:
    build:
      # Normally this folder. start-harmony.bat overrides it with a staging copy
      # outside the OneDrive sync root: Docker cannot read files that OneDrive
      # keeps as Files On-Demand placeholders and aborts the context load with
      # "invalid file request <path>". See the note in that script.
      context: ${HARMONY_BUILD_CONTEXT:-.}
      args:
        # Baked into the bundle at build time — see the Dockerfile. 127.0.0.1
        # is correct for browsing on this machine; to reach the app from a phone
        # or another laptop, rebuild with this set to the host's LAN address
        # (e.g. http://192.168.1.20:55321), because the browser resolves it, not
        # the container.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:55321}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
    container_name: harmony_suite_web
    ports:
      - '8080:80'
    restart: unless-stopped
