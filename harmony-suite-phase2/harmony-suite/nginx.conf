server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Harmony Suite routes on the client (React Router), so the server only ever
  # has one real page. Without this fallback, refreshing on /dashboard/payroll
  # or opening a shared /careers link asks nginx for a file that doesn't exist
  # and returns 404 — the classic single-page-app deployment mistake.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints every asset filename, so a given URL's contents can never
  # change. index.html must NOT be cached the same way, or the browser keeps
  # serving an old page that points at assets a new deploy has deleted.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
